[package]
name = "tex"
version = "0.1.0"
edition = "2024"

[dependencies]
termbox-rs = { path = "./termbox-rs" }
unicode-width = "0.2"

[patch.crates-io]
termbox-sys = { path = "termbox-rs/vendor/termbox-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
